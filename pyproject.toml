[project]
name = "skillm-profile"
version = "0.1.0"
description = "Declarative profile manager for skillm"
readme = "README.md"
authors = [
    { name = "Martín González Buitrón", email = "martingonzalezbuitron@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "tomli-w>=1.2.0",
]

[project.scripts]
skillm-profile = "skillm_profile.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]